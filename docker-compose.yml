# AI Test Generator — production stack
#
# Сервисы: postgres, redis, app (API), worker (BullMQ), nginx
#
# Запуск (из каталога «ИИ тест»):
#   cp .env.example .env   # задать GEMINI_API_KEY, POSTGRES_PASSWORD
#   docker compose up -d --build
#
# С edu_atg на одном хосте — см. docs/DEPLOY.md (общая Docker-сеть).

name: edu_atg_ai_testgen

services:
  postgres:
    image: postgres:16-alpine
    container_name: ai-testgen-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ai_testgen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ai_testgen_dev}
      POSTGRES_DB: ${PGDATABASE:-ai_testgen}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    networks:
      - ai_testgen

  redis:
    image: redis:7-alpine
    container_name: ai-testgen-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --maxmemory 512mb
      --maxmemory-policy volatile-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ai_testgen

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: ai-testgen-app:latest
    pull_policy: build
    container_name: ai-testgen-app
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3002
      DATA_DIR: /data
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ai_testgen}
      PGUSER: ai_testgen
      PGPASSWORD: ${POSTGRES_PASSWORD:-ai_testgen_dev}
      DB_CLIENT: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-testgen-docs}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/data
    ports:
      - "${APP_HOST_PORT:-3002}:3002"
    expose:
      - "3002"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://127.0.0.1:3002/api/health',(r)=>{const ok=r.statusCode===200;r.resume();r.on('end',()=>process.exit(ok?0:1));r.on('error',()=>process.exit(1));}).on('error',()=>process.exit(1));"]
      interval: 15s
      timeout: 20s
      start_period: 120s
      retries: 8
    networks:
      ai_testgen:
        aliases:
          - ai-testgen-app

  worker:
    image: ai-testgen-app:latest
    pull_policy: build
    container_name: ai-testgen-worker
    restart: unless-stopped
    command: ["node", "worker.js"]
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_started
    environment:
      NODE_ENV: production
      DATA_DIR: /data
      DATABASE_URL: ""
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${PGDATABASE:-ai_testgen}
      PGUSER: ai_testgen
      PGPASSWORD: ${POSTGRES_PASSWORD:-ai_testgen_dev}
      DB_CLIENT: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      STORAGE_BACKEND: ${STORAGE_BACKEND:-local}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal}
      MINIO_PORT: ${MINIO_PORT:-9000}
      MINIO_USE_SSL: ${MINIO_USE_SSL:-false}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-}
      MINIO_BUCKET: ${MINIO_BUCKET:-ai-testgen-docs}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app_data:/data
    networks:
      - ai_testgen

  nginx:
    image: nginx:1.25-alpine
    container_name: ai-testgen-nginx
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-80}:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_started
    networks:
      - ai_testgen

volumes:
  app_data:
    name: ai-testgen-data
  postgres_data:
    name: ai-testgen-postgres-data
  redis_data:
    name: ai-testgen-redis-data

networks:
  ai_testgen:
    name: ${AI_TESTGEN_DOCKER_NETWORK:-edu_atg_ai_testgen_default}
    driver: bridge
